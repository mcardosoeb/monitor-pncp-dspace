name: Monitor PNCP x DSPACE

on:
  schedule:
    # Segunda a sexta, horário de Brasília (UTC-3): 11h00 e 16h00 = 14h00 e 19h00 UTC
    - cron: "0 14 * * 1-5"
    - cron: "0 19 * * 1-5"
  workflow_dispatch: {}   # permite rodar manualmente pela aba Actions

permissions:
  contents: write
  pages: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Consultar painel e enviar e-mail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ vars.EMAIL_TO || 'conf15companhia@gmail.com' }}
          OM_NOME: ${{ vars.OM_NOME || '15ª Cia Inf Mtz' }}
        run: python monitor.py

      - name: Salvar histórico no repositório
        if: always()
        run: |
          git config user.name "monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/historico.json docs/historico.js
          git diff --cached --quiet || git commit -m "Consulta $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
          git pull --rebase --autostash || true
          git push

      # o commit feito pelo robô não dispara o GitHub Pages sozinho:
      # pede uma nova publicação da página (Pages em "Deploy from a branch", pasta /docs)
      - name: Atualizar página do histórico
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages/builds" \
            || echo "::warning::Não foi possível pedir a publicação do GitHub Pages."
