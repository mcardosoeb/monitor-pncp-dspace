name: Publicar página do histórico

on:
  # depois de cada consulta (o commit do robô não dispara workflows sozinho)
  workflow_run:
    workflows: ["Monitor PNCP x DSPACE"]
    types: [completed]
  # quando você enviar alterações para a branch main
  push:
    branches: [main]
  # botão "Run workflow" na aba Actions
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # pega o histórico mais recente, já com a última consulta

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
